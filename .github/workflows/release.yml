# Fabrique Marginalia pour Mac et Windows.
#  - étiquette v* poussée (git tag v3.2 && git push origin v3.2) : fabrique, teste le démarrage,
#    puis publie les .dmg et .exe dans une Release du dépôt ;
#  - lancement manuel (onglet Actions › Release › Run workflow, ou `gh workflow run release.yml -f version=3.2`) :
#    avec une version, fabrique puis publie la Release v<version> (l'étiquette est créée par le workflow) ;
#    sans version, fabrique et teste seulement (fichiers dans les « Artifacts » de l'exécution).
# Aucune signature : ni certificat Apple/Microsoft, ni notarisation (le Mac reçoit une signature ad hoc).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 3.2) — vide : fabriquer sans publier'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  # Pas de recherche de certificat de signature (ni Mac ni Windows).
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # Le binaire Electron de node_modules ne sert pas ici : electron-builder télécharge le sien.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # Version publiée : celle de l'étiquette v*, sinon celle saisie au lancement manuel.
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}

jobs:
  build:
    name: Fabrication ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon : fabrique arm64 et x64 dans le même job
            label: Mac (arm64 + x64)
            artifact: marginalia-mac
            files: release/builder/*.dmg
          - os: windows-latest # x64 : fabrique x64 et arm64 dans le même job
            label: Windows (x64 + arm64)
            artifact: marginalia-win
            files: release/builder/*.exe
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron et outils electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Version
        if: env.RELEASE_VERSION != ''
        shell: bash
        run: |
          v="${RELEASE_VERSION#v}"
          # v3.2 → 3.2.0 (npm exige trois nombres)
          if [[ "$v" =~ ^[0-9]+\.[0-9]+$ ]]; then v="$v.0"; fi
          npm version --no-git-tag-version --allow-same-version "$v"
          echo "Version : $(node -p "require('./package.json').version")"

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Construire l'interface (Vite)
        run: npm run build

      - name: Empaqueter (Mac)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Empaqueter (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx electron-builder --win --x64 --publish never
          npx electron-builder --win --arm64 --publish never

      - name: Test de démarrage (Mac)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        shell: bash
        run: |
          exes=("release/builder/mac-arm64/Marginalia.app/Contents/MacOS/Marginalia")
          # La version Intel ne tourne que si Rosetta 2 est présent sur la machine.
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            exes+=("release/builder/mac/Marginalia.app/Contents/MacOS/Marginalia")
          else
            echo "::notice::Rosetta 2 absent : version x64 fabriquée mais non lancée."
          fi
          node scripts/smoke-packaged.mjs "${exes[@]}"

      - name: Test de démarrage (Windows x64)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        # La version arm64 ne peut pas s'exécuter sur une machine x64 : elle est fabriquée, pas lancée.
        run: node scripts/smoke-packaged.mjs release/builder/win-unpacked/Marginalia.exe

      - name: Lister les fichiers produits
        shell: bash
        run: ls -la release/builder

      - name: Déposer les fichiers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          # Stockage compté sur le quota du dépôt privé : court pour une étiquette (la Release garde les fichiers).
          retention-days: ${{ env.RELEASE_VERSION != '' && 1 || 7 }}

  release:
    name: Publier la Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Récupérer les fichiers
        uses: actions/download-artifact@v4
        with:
          pattern: marginalia-*
          path: out
          merge-multiple: true

      - name: Fichiers à publier
        run: ls -la out

      - name: Nom de l'étiquette
        id: tag
        shell: bash
        run: v="${RELEASE_VERSION#v}"; echo "name=v$v" >> "$GITHUB_OUTPUT"

      - name: Créer la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Marginalia ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          # v4.0.0-beta.1 → pré-version
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          fail_on_unmatched_files: true
          files: |
            out/*.dmg
            out/*.exe
